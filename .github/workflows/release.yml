name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Create release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be created from main."
          exit 1

      - name: Determine next version
        id: version
        shell: bash
        run: |
          latest=$(
            git tag --list \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )

          # The repository currently identifies itself as 0.6.0.
          # Use that as the baseline until the first release tag exists.
          if [ -z "$latest" ]; then
            latest="0.6.0"
          fi

          IFS='.' read -r major minor patch <<< "$latest"

          case "${{ inputs.bump }}" in
            patch)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
          esac

          version="${major}.${minor}.${patch}"

          echo "Current version: $latest"
          echo "Next version:    $version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "gawaHUD $VERSION"
          git push origin "$VERSION"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## gawaHUD $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Created and pushed release tag \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          echo "The CurseForge GitHub webhook should now invoke the CurseForge packager." >> "$GITHUB_STEP_SUMMARY"